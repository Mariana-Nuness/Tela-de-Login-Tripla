<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login - Nível 2</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #00d2ff, #0052d4);
        }

        .container {
            display: flex;
            width: 90vw;
            max-width: 1000px;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .item {
            width: 30%;
            height: 580px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #Login1, #Login3 {
            background-color: #ffffff;
        }

        .header-bg {
            width: 100%;
            height: 180px;
            background: linear-gradient(180deg, #0099ff, #0044ff);
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .logo-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-circle img {
            width: 40px;
            height: 40px;
        }

        .form-container {
            width: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .input-group {
            width: 100%;
            margin-bottom: 12px;
            position: relative;
        }

        .input-group input {
            width: 100%;
            height: 38px;
            padding: 0 35px 0 12px;
            border: 1px solid #0088ff;
            border-radius: 20px;
            outline: none;
            font-size: 12px;
        }

        .input-group .icon {
            position: absolute;
            right: 4px;
            top: 3px;
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 12px;
        }

        .options-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            color: #555;
            margin: 5px 0 15px 0;
        }

        .options-row label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .options-row a {
            color: #333;
            text-decoration: none;
        }

        .btn {
            width: 100px;
            height: 32px;
            background: linear-gradient(to right, #00aaff, #0055ff);
            border: none;
            border-radius: 16px;
            color: white;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 100, 255, 0.3);
        }

        .social-text {
            font-size: 10px;
            font-weight: bold;
            color: #333;
            margin-top: 15px;
            margin-bottom: 8px;
        }

        .social-icons {
            display: flex;
            gap: 10px;
        }

        .social-icon {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1px solid #777;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            color: #555;
            text-decoration: none;
        }

        .footer-wave {
            width: 100%;
            height: 70px;
            background: linear-gradient(180deg, #0066ff, #0022aa);
            border-top-left-radius: 0;
            border-top-right-radius: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: auto;
        }

        .footer-wave a {
            color: white;
            font-size: 11px;
            text-decoration: none;
        }

        #Login2 {
            background: linear-gradient(180deg, #0088ff 0%, #0044ff 50%, #00aaff 100%);
            justify-content: space-between;
            padding: 40px 20px 20px 20px;
            color: white;
            text-align: center;
        }

        .splash-header {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .splash-title {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-top: 15px;
        }

        .splash-subtitle {
            font-size: 10px;
            opacity: 0.7;
            letter-spacing: 2px;
            margin-top: 3px;
        }

        .splash-buttons {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .btn-splash {
            width: 85%;
            height: 36px;
            background-color: white;
            border: none;
            border-radius: 18px;
            color: #0044ff;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        .touch-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .touch-text {
            font-size: 10px;
            opacity: 0.9;
        }

        .touch-icon {
            width: 50px;
            height: 50px;
            border: 2px dashed rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
        }

        .touch-label {
            font-size: 10px;
        }
    </style>
</head>

<body>

    <div class="container">
        
        <div class="item" id="Login1">
            <div class="header-bg">
                <div class="logo-circle">
                    <img src="Logotipo.png" alt="Logo">
                </div>
            </div>
            <div class="form-container">
                <div class="input-group">
                    <input type="text" placeholder="User Name">
                    <span class="icon">👤</span>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Password">
                    <span class="icon">🔒</span>
                </div>
                <div class="options-row">
                    <label><input type="checkbox"> Remember Password</label>
                    <a href="#">Forgot Password?</a>
                </div>
                <button class="btn">Sign in</button>
                <span class="social-text">Sign in with Social Media</span>
                <div class="social-icons">
                    <a href="#" class="social-icon">f</a>
                    <a href="#" class="social-icon">t</a>
                    <a href="#" class="social-icon">in</a>
                </div>
            </div>
            <div class="footer-wave">
                <a href="#">Don't have account? <strong>Sign up</strong> ➔</a>
            </div>
        </div>

        <div class="item" id="Login2">
            <div class="splash-header">
                <div class="logo-circle">
                    <img src="Logotipo.png" alt="Logo">
                </div>
                <div class="splash-title">COMPANY NAME</div>
                <div class="splash-subtitle">SOLOGAN HERE</div>
            </div>

            <div class="splash-buttons">
                <button class="btn-splash">Sign in</button>
                <button class="btn-splash">Sign up</button>
            </div>

            <div class="touch-section">
                <span class="touch-text">Now! Quick Login Use Touch ID</span>
                <div class="touch-icon">👆</div>
                <span class="touch-label">Use Touch ID</span>
            </div>
        </div>

        <div class="item" id="Login3">
            <div class="header-bg">
                <div class="logo-circle">
                    <img src="Logotipo.png" alt="Logo">
                </div>
            </div>
            <div class="form-container">
                <div class="input-group">
                    <input type="text" placeholder="User Name">
                    <span class="icon">👤</span>
                </div>
                <div class="input-group">
                    <input type="email" placeholder="E-mail">
                    <span class="icon">✉</span>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Password">
                    <span class="icon">🔒</span>
                </div>
                <div class="options-row" style="justify-content: flex-start;">
                    <label><input type="checkbox"> Allow Term & Conditions</label>
                </div>
                <button class="btn" style="margin-top: 15px;">Sign up</button>
            </div>
            <div class="footer-wave">
                <a href="#">Already have an account? <strong>Sign in</strong> ➔</a>
            </div>
        </div>

    </div>

</body>

</html>
